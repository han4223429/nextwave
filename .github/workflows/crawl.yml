name: Refresh portal opportunities

on:
  schedule:
    # Every hour at :17, away from the busy top of the hour.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: portal-opportunity-crawl
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-crawler.txt
      - name: Install crawler dependencies
        run: python -m pip install -r requirements-crawler.txt
      - name: Check parsing and ownership protections
        run: python -m unittest discover -s tests -p 'test_crawler*.py' -v
      - name: Fetch source metadata
        id: crawl
        continue-on-error: true
        run: python crawler.py
      - name: Validate snapshot including saved failure status
        run: python crawler.py --validate
      - name: Save only the public snapshot
        id: save
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/opportunities.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'chore: refresh portal opportunities'
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild an existing branch-based GitHub Pages site
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          pages_source="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '[.build_type // "", .source.branch // "", .source.path // ""] | @tsv')"
          IFS=$'\t' read -r build_type pages_branch pages_path <<< "$pages_source"
          case "$build_type" in
            legacy)
              if [[ "$pages_branch" != "$DEFAULT_BRANCH" || "$pages_path" != '/' ]]; then
                echo '::warning::Pages does not publish the default branch root; snapshot saved without requesting a build.'
                echo '- Pages: source differs from the crawler branch/root; build skipped.' >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
              echo '- Pages: rebuild requested for the updated public snapshot.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            workflow)
              echo '::notice::Pages uses a custom deployment workflow; no branch-based build requested.'
              echo '- Pages: custom workflow deployment must publish the saved snapshot.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo '::error::Unrecognized Pages configuration; the public snapshot was saved but deployment could not be determined.'
              exit 1
              ;;
          esac
      - name: Publish run summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('data/opportunities.json')
          if path.exists():
              snapshot = json.loads(path.read_text())
              lines = ['## Portal crawler', f"Last successful data: {snapshot.get('lastSuccessAt') or 'none'}"]
              for source in snapshot['sources']:
                  lines.append(f"- {source['name']}: {source['status']}, {source['itemCount']} records")
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('\n'.join(lines) + '\n')
          PY
      - name: Report source failures after preserving prior data
        if: steps.crawl.outcome == 'failure'
        run: exit 1
